<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Modern wallet/money icon representing expense tracking -->
  <rect width="512" height="512" rx="128" fill="#10b981"/>
  
  <!-- Wallet shape with rounded corners -->
  <rect x="128" y="160" width="256" height="224" rx="24" fill="white" opacity="0.95"/>
  
  <!-- Money symbol circle -->
  <circle cx="256" cy="272" r="72" fill="#10b981"/>
  
  <!-- Nepali Rupee symbol (रु) -->
  <text x="256" y="300" font-family="Arial, sans-serif" font-size="64" font-weight="bold" fill="white" text-anchor="middle">रु</text>
  
  <!-- Card notch detail -->
  <rect x="320" y="200" width="48" height="32" rx="6" fill="#10b981" opacity="0.25"/>
  
  <!-- Subtle shadow for depth -->
  <rect x="128" y="160" width="256" height="224" rx="24" fill="black" opacity="0.05"/>
</svg>

