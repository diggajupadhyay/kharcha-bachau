name: Deploy

# Runs on the default branch. The repository's default is `master`; if it is ever
# renamed, this trigger needs to change with it or nothing will deploy.
on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm ci --prefix mobile
      - run: npx tsc --noEmit
      - run: npm test --prefix mobile

  deploy:
    name: Deploy site and /app
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # Firebase config is inlined into the web bundle at build time. It arrives as
      # repository *variables* rather than secrets because it is public by design —
      # the same values are readable in the shipped bundle — and keeping it out of the
      # repo means a fork cannot be pointed at this project. Without it the app still
      # works, but in guest mode with no cloud sync, which looks fine and is not, so
      # this step fails loudly instead.
      - name: Write .env from repository variables
        run: |
          set -euo pipefail
          umask 077
          {
            echo "VITE_FIREBASE_API_KEY=${{ vars.VITE_FIREBASE_API_KEY }}"
            echo "VITE_FIREBASE_AUTH_DOMAIN=${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}"
            echo "VITE_FIREBASE_PROJECT_ID=${{ vars.VITE_FIREBASE_PROJECT_ID }}"
            echo "VITE_FIREBASE_STORAGE_BUCKET=${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}"
            echo "VITE_FIREBASE_MESSAGING_SENDER_ID=${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}"
            echo "VITE_FIREBASE_APP_ID=${{ vars.VITE_FIREBASE_APP_ID }}"
          } > .env
          echo "EXPO_PUBLIC_FIREBASE_API_KEY=${{ vars.VITE_FIREBASE_API_KEY }}"         >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}" >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_FIREBASE_PROJECT_ID=${{ vars.VITE_FIREBASE_PROJECT_ID }}"   >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}" >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}" >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_FIREBASE_APP_ID=${{ vars.VITE_FIREBASE_APP_ID }}"           >> "$GITHUB_ENV"

      # Order matters: Vite empties dist/, so the landing page is built first and the
      # web app is written into dist/app afterwards.
      - run: npm run build:all

      # Assert the bundle really has its config before uploading. The failure mode
      # this guards is a guest-only build that looks perfectly healthy.
      - name: Confirm the web bundle has its Firebase config
        run: |
          set -euo pipefail
          hits=$(grep -F -o "$VITE_FIREBASE_PROJECT_ID" \
            dist/app/_expo/static/js/web/index-*.js | wc -l)
          if [ "$hits" -eq 0 ]; then
            echo "::error::The web bundle has no Firebase config inlined — it would ship as a guest-only app with no error. See DEPLOY.md on the Metro transform cache."
            exit 1
          fi
          echo "Firebase config present ($hits references)."

      # The official CLI rather than a third-party action: the service-account
      # credentials work identically locally and here, so there is no wrapper whose
      # input format or tag naming can break a deploy.
      - name: Write the service account
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" > "$RUNNER_TEMP/firebase-adminsdk.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-adminsdk.json" >> "$GITHUB_ENV"

      - run: npm install -g firebase-tools@latest
      - name: Deploy to Firebase Hosting
        run: firebase deploy --only hosting --project ${{ secrets.FIREBASE_PROJECT_ID }}

# Android is deliberately absent. The release signing key is not in this repository
# and not in these secrets, so nothing here can produce an installable build. Signed
# APKs and AABs are published by mobile/release.sh, which runs locally, verifies the
# certificate before publishing, and attaches the files to a GitHub Release. Play Store
# upload is a separate manual step. See DEPLOY.md.
